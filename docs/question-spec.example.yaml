# Question spec v2 (fc-question/2026.10). Three examples from Season 1; the full set is
# generated by `fc questions generate` into questions/2026-us-midterms/questions.json.

- schema: fc-question/2026.10
  question_id: senate-ga
  family: senate
  statement: "Which party's nominee will win the November 3, 2026 election for U.S. Senate in Georgia (class2 seat)?"
  output_type: categorical
  categories: [D, R, Other]
  core: true
  manipulation_risk: low
  rules_version: "2026.10"
  event_date: 2026-11-03
  state: GA
  incumbent_party: D
  open_seat: false
  pres_2024: R
  resolution:
    primary_source: https://en.wikipedia.org/wiki/2026_United_States_Senate_elections
    provisional_rule: winner_party_as_recorded_in_results_table_stable_72h
    final_rule: certified_result_from_state_election_authority
    fallback_sources: ["state election authority results page", "council"]
    void_if: ["election for this seat postponed or cancelled", "no winner certified by T_final and no runoff scheduled"]
    T_final: 2026-12-15
    resolver: automated

- schema: fc-question/2026.10
  question_id: control-house
  family: control
  statement: "Will the Democratic Party hold a majority of seats (at least 218 of 435) in the U.S. House of Representatives when the 120th Congress is seated?"
  output_type: binary
  core: true
  manipulation_risk: low
  rules_version: "2026.10"
  event_date: 2026-11-03
  resolution:
    primary_source: https://en.wikipedia.org/wiki/2026_United_States_House_of_Representatives_elections
    provisional_rule: seats_by_party_as_recorded_in_results_table_stable_72h
    final_rule: membership_at_seating_of_the_120th_congress_2027-01-03
    fallback_sources: ["house.gov / senate.gov official rosters", "council"]
    void_if: ["seating of the 120th Congress delayed beyond T_final"]
    T_final: 2027-01-06
    resolver: automated

- schema: fc-question/2026.10
  question_id: seats-house-d
  family: seats
  statement: "How many seats will the Democratic Party hold in the U.S. House of Representatives when the 120th Congress is seated (excluding independents)?"
  output_type: quantile
  quantile_levels: [0.025, 0.1, 0.25, 0.4, 0.5, 0.6, 0.75, 0.9, 0.975]
  bounds: [0, 435]
  unit: seats
  core: true
  manipulation_risk: low
  rules_version: "2026.10"
  event_date: 2026-11-03
  resolution:
    primary_source: https://en.wikipedia.org/wiki/2026_United_States_House_of_Representatives_elections
    provisional_rule: seats_by_party_as_recorded_in_results_table_stable_72h
    final_rule: membership_at_seating_of_the_120th_congress_2027-01-03
    fallback_sources: ["house.gov / senate.gov official rosters", "council"]
    void_if: ["seating of the 120th Congress delayed beyond T_final"]
    T_final: 2027-01-06
    resolver: automated
