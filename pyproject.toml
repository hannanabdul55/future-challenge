[project]
name = "future-challenge"
version = "0.1.0"
description = "Future Challenge: contamination-proof open evaluation hub for AI models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "cryptography>=42",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
fc = "fc.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fc*"]

[tool.pytest.ini_options]
testpaths = ["tests", "task-families"]

[tool.ruff]
line-length = 100
