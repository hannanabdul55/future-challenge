name: pages
# BOARD-05: rebuild the season board after every push that changes outputs, rounds or truth,
# and after the 18:00 UTC reveal, then publish leaderboard/ to GitHub Pages.
on:
  push:
    branches: [main]
    paths: ["model-output/**", "rounds/**", "target-data/truth/**", "fc/**", "leaderboard/**"]
  schedule:
    - cron: "15 18 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SEASON: 2026-us-midterms

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - name: Score and build the board
        run: |
          uv run fc season score --season "$SEASON" || echo "no scores yet"
          uv run fc season board --season "$SEASON" --out leaderboard/index.html
          cp -r eval/out/$SEASON leaderboard/data || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: leaderboard
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
